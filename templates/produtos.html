{% extends "base.html" %}
{% block content %}
<section style="background: #ffffff; padding: 60px 0 20px 0; text-align: center;">
    <h1 style="text-transform: uppercase; letter-spacing: 6px; font-weight: 300; font-size: 1.5rem; margin-bottom: 30px;">{{ category }} Collection</h1>
</section>

<section style="background: #ffffff; padding: 60px 0;">
    <div style="max-width: 1400px; margin: auto; padding: 0 40px;">
        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 50px;">
            {% if products %}
                {% for p in products %}
                <div class="card" style="border: none; background: #fff; padding: 0;">
                    <div style="width: 100%; height: 400px; background: #fdfdfd; border: 1px solid #f1f1f1; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 4px;">

                        <!-- AQUI ESTÁ A CORREÇÃO: Ele vai buscar à pasta static/images automaticamente -->
                        <img src="{{ url_for('static', filename='images/' + p.image) }}"
                             alt="{{ p.name }}"
                             style="max-width: 85%; max-height: 85%; object-fit: contain; transition: 0.6s ease;"
                             onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"
                             onerror="this.src='/static/images/AliExpress_mesa_1.jpg';">
                    </div>

                    <div style="padding: 25px 0;">
                        <h3 style="margin: 0; font-weight: 500; font-size: 1rem; color: #1a1a1a; text-transform: uppercase;">{{ p.name }}</h3>
                        <p style="margin: 10px 0; font-size: 1.3rem; font-weight: 700; color: #27ae60;">{{ p.price }}</p>
                        <a href="{{ p.link }}" target="_blank" style="display: inline-block; margin-top: 15px; background: #000; color: #fff; text-decoration: none; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; padding: 12px 35px; border-radius: 2px;">
                            View on {{ p.affiliate }} →
                        </a>
                    </div>
                </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
